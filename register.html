<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · Jovia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="narrow">
    <div class="card">
      <a class="logo" href="index.html" style="justify-content:center">
        <svg viewBox="0 0 48 36" aria-hidden="true"><path d="M8 22c0-8 6-14 14-14 4 0 7 1.4 9.5 3.8L38 6c-3.6-3.7-8.6-6-14.5-6C11.3 0 2 9.4 2 22c0 6.2 2.4 11.4 6.3 15.2L14 31.4C10.4 28.5 8 25.5 8 22Zm20.2-7.4c2.2 2 3.5 4.6 3.5 7.6 0 6.4-5.1 11.6-11.4 11.6-2.2 0-4.2-.6-5.9-1.7L9.2 38C12.5 40.6 16.6 42 21 42c11.6 0 21-9.4 21-21 0-5.3-2-10.1-5.3-13.8l-8.5 7.4Z" fill="#F5C518"/></svg>
        <span><b>Jovia</b><small>Network</small></span>
      </a>
      <h1 style="text-align:center;margin-top:18px">Create account</h1>
      <p class="muted" style="text-align:center">Join Jovia Network — choose Silver or Gold</p>
      <form onsubmit="registerForm(event)">
        <label>Full name <input name="fullName" required /></label>
        <label>Username <input name="username" required /></label>
        <label>Email <input name="email" type="email" required /></label>
        <label>Phone number <input name="phone" required /></label>
        <label>Country
          <select name="country">
            <option>Nigeria</option><option>Ghana</option><option>Kenya</option>
            <option>South Africa</option><option>United Kingdom</option>
            <option>United States</option><option>Canada</option><option>Other</option>
          </select>
        </label>
        <label>Password <input id="pw" name="password" type="password" required minlength="8" /></label>
        <button type="button" class="ghost-btn full" onclick="togglePass('pw')">Show / hide password</button>
        <label>Confirm password <input id="pw2" name="confirm" type="password" required minlength="8" /></label>
        <h2>Select your plan</h2>
        <div class="grid2">
          <button type="button" class="plan" id="p-silver" onclick="pickPlan('silver')">
            <img src="images/1000032047.jpg" alt="Silver">
            <h3>Silver</h3><p class="amount" style="font-size:28px">₦9,000</p><p class="ok">Cashback ₦9,000 ($9)</p>
          </button>
          <button type="button" class="plan" id="p-gold" onclick="pickPlan('gold')">
            <img src="images/1000032046.jpg" alt="Gold">
            <h3>Gold</h3><p class="amount" style="font-size:28px">₦15,000</p><p class="ok">Cashback ₦15,000 ($15)</p>
          </button>
        </div>
        <input type="radio" name="plan" value="silver" class="hidden" />
        <input type="radio" name="plan" value="gold" class="hidden" />
        <p id="error" class="err"></p>
        <button class="gold-btn full" type="submit">Create account</button>
      </form>
      <p class="muted" style="text-align:center;margin-top:18px">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
