<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Jovia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="narrow">
    <div class="card">
      <a class="logo" href="index.html" style="justify-content:center">
        <svg viewBox="0 0 48 36" aria-hidden="true"><path d="M8 22c0-8 6-14 14-14 4 0 7 1.4 9.5 3.8L38 6c-3.6-3.7-8.6-6-14.5-6C11.3 0 2 9.4 2 22c0 6.2 2.4 11.4 6.3 15.2L14 31.4C10.4 28.5 8 25.5 8 22Zm20.2-7.4c2.2 2 3.5 4.6 3.5 7.6 0 6.4-5.1 11.6-11.4 11.6-2.2 0-4.2-.6-5.9-1.7L9.2 38C12.5 40.6 16.6 42 21 42c11.6 0 21-9.4 21-21 0-5.3-2-10.1-5.3-13.8l-8.5 7.4Z" fill="#F5C518"/></svg>
        <span><b>Jovia</b><small>Network</small></span>
      </a>
      <div id="login-box">
        <h1 style="text-align:center;margin-top:18px">Welcome back</h1>
        <p class="muted" style="text-align:center">Login to your Jovia dashboard</p>
        <form onsubmit="loginForm(event)">
          <label>Email <input name="email" type="email" required /></label>
          <label>Password
            <span class="pw-wrap"><input id="pw" name="password" type="password" required /><button class="eye" type="button" onclick="togglePass('pw')" aria-label="Show password">👁</button></span>
          </label>
          <p style="text-align:right"><button class="usd-toggle" type="button" onclick="document.getElementById('login-box').classList.add('hidden'); document.getElementById('reset-box').classList.remove('hidden')">Forgot password?</button></p>
          <p id="error" class="err"></p>
          <p id="ok" class="ok"></p>
          <button class="gold-btn full" type="submit">Login</button>
        </form>
        <p class="muted" style="text-align:center;margin-top:18px">Don't have an account? <a href="register.html" style="color:var(--primary);font-weight:700">Register</a></p>
        <p style="text-align:center"><a class="muted" href="index.html" style="font-size:12px">Back to home</a></p>
      </div>
      <div id="reset-box" class="hidden">
        <h1 style="text-align:center;margin-top:18px">Reset password</h1>
        <p class="muted" style="text-align:center">Enter the email and username from your Jovia registration, then choose a new password.</p>
        <form onsubmit="resetForm(event)">
          <label>Email <input name="email" type="email" required /></label>
          <label>Username <input name="username" required /></label>
          <label>New password <input name="newPassword" type="password" required minlength="8" /></label>
          <label>Confirm new password <input name="confirm" type="password" required minlength="8" /></label>
          <p id="error" class="err"></p>
          <button class="gold-btn full" type="submit">Update password</button>
        </form>
        <p style="text-align:center;margin-top:14px"><a href="login.html">Back to login</a></p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
